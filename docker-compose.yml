services:
  db:
    image: postgres:16
    container_name: postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  datos_db: